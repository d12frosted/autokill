name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Only the plugin project needs these; the core library and its tests are
      # deliberately free of them.
      - name: Fetch Dalamud
        run: |
          curl -sSL https://goatcorp.github.io/dalamud-distrib/latest.zip -o dalamud.zip
          unzip -q dalamud.zip -d "$HOME/dalamud"
          echo "DALAMUD_HOME=$HOME/dalamud" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test AutoKill.Tests/AutoKill.Tests.csproj --nologo

      - name: Build
        run: dotnet build AutoKill/AutoKill.csproj -c Release --nologo

  data:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/data

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q
