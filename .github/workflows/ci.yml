name: ci

on:
  push:
    branches: [main]
  pull_request:

# A push that supersedes a running build replaces it instead of queueing behind
# it. Only on branches and PRs: every commit on main keeps its own verdict, so
# a regression can be pinned to the commit that brought it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Keyed on the project files, since those are where dependencies are
      # declared; there are no lock files to key on.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Only the plugin project needs these; the core library and its tests are
      # deliberately free of them.
      - name: Fetch Dalamud
        run: |
          curl -sSL https://goatcorp.github.io/dalamud-distrib/latest.zip -o dalamud.zip
          unzip -q dalamud.zip -d "$HOME/dalamud"
          echo "DALAMUD_HOME=$HOME/dalamud" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test AutoKill.Tests/AutoKill.Tests.csproj --nologo

      - name: Build
        run: dotnet build AutoKill/AutoKill.csproj -c Release --nologo

  data:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/data

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q
