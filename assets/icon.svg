<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    AutoKill plugin icon.

    Form follows the Dalamud plugin convention: a square with a bright frame, a
    near black panel, and one flat line-art glyph. Colours are the d12frosted
    palette, and there is deliberately no corner badge, since those belong to
    the organisation that publishes a plugin.

    The glyph is a mark inside a patrol route, which is the thing this plugin
    does that others do not: not merely kill something, but go round a field
    killing it again each time it comes back.

    Gradients are in user space on purpose. Object bounding box gradients are
    not painted at all on a shape with no width, which silently loses every
    straight line in the drawing.
  -->
  <defs>
    <linearGradient id="warm" gradientUnits="userSpaceOnUse" x1="64" y1="64" x2="448" y2="448">
      <stop offset="0" stop-color="#F0BC62"/>
      <stop offset="1" stop-color="#E07A67"/>
    </linearGradient>
    <linearGradient id="warmFaint" gradientUnits="userSpaceOnUse" x1="64" y1="448" x2="448" y2="64">
      <stop offset="0" stop-color="#F0BC62" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#E07A67" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#warm)"/>
  <rect x="22" y="22" width="468" height="468" rx="76" fill="#1A1A1A"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- the route, broken because it is walked again and again -->
    <circle cx="256" cy="256" r="182" stroke="url(#warmFaint)" stroke-width="13"
            stroke-dasharray="4 32"/>

    <!-- the mark, open at the compass points so the sights read through -->
    <g stroke="url(#warm)" stroke-width="32">
      <path d="M 302 154 A 112 112 0 0 1 358 210"/>
      <path d="M 358 302 A 112 112 0 0 1 302 358"/>
      <path d="M 210 358 A 112 112 0 0 1 154 302"/>
      <path d="M 154 210 A 112 112 0 0 1 210 154"/>
    </g>

    <!-- sights -->
    <g stroke="url(#warm)" stroke-width="24">
      <path d="M 256 92 V 156"/>
      <path d="M 256 356 V 420"/>
      <path d="M 92 256 H 156"/>
      <path d="M 356 256 H 420"/>
    </g>
  </g>

  <!-- what the sights are on -->
  <circle cx="256" cy="256" r="40" fill="url(#warm)"/>
</svg>
