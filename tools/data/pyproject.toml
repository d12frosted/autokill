[project]
name = "autokill-data"
version = "0.1.0"
description = "Builds AutoKill's mob, drop and spawn-position index from community datasets"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
autokill-data = "autokill_data.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autokill_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
